server {
  listen 80;
  root /usr/share/nginx/html;

  # nginx's mime.types already maps .wasm to application/wasm (OpenCascade, PlaneGCS)

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Module manifests and entries keep their names; always revalidate
  location /plugins/ {
    add_header Cache-Control "no-cache";
  }
}
